<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PDF Kiosk" />
  <meta name="format-detection" content="telephone=no" />
  <title>PDF Kiosk</title>
  <meta name="description" content="Lecteur PDF kiosque hors ligne pour iPad" />
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="modulepreload" href="./vendor/pdf.min.mjs" />
</head>
<body>
  <main id="stage" class="stage" aria-label="Présentation PDF">
    <div id="page-wrap" class="page-wrap" aria-live="off">
      <canvas id="canvas" role="img" aria-label="Page PDF"></canvas>
      <div id="link-layer" class="link-layer" aria-label="Liens du document"></div>
    </div>

    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loader-text">Chargement du document…</p>
    </div>

    <div id="error" class="error" role="alert" hidden>
      <p id="error-text">Impossible de charger le document.</p>
      <button id="retry" class="retry" type="button">Réessayer</button>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
